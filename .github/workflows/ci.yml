name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  LINT: github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.areas.outputs.go }}
      scripts: ${{ steps.areas.outputs.scripts }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0
      - id: areas
        name: Detect changed areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'merge_group' && github.event.merge_group.base_sha || github.event_name == 'push' && github.event.before || '' }}
        run: .github/scripts/changed-areas.sh "$BASE" "$GITHUB_SHA" | tee -a "$GITHUB_OUTPUT"

  test:
    name: Unit tests, vet, lint & style policy
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
      - name: Test with race detection and coverage
        run: go test -race -coverprofile=unit-coverage.out ./...
      - name: Coverage summary
        run: go tool cover -func=unit-coverage.out
      - name: Vet
        run: go vet ./...
      - name: Format
        run: go run "$LINT" fmt --diff
      - name: Lint
        run: go run "$LINT" run
      - name: Style policy
        run: go test -run TestRepositoryStyle ./internal/style

  acceptance:
    name: "Acceptance ${{ matrix.label }}"
    needs: changes
    if: needs.changes.outputs.go == 'true' && github.event_name != 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            label: "1/4: generated projects + tooling, PostgreSQL, terminal & browser suites"
          - shard: 1
            label: "2/4: generated projects"
          - shard: 2
            label: "3/4: generated projects"
          - shard: 3
            label: "4/4: generated projects"
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: rubric_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rubric_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUBRIC_ACCEPTANCE: "1"
      RUBRIC_SHARD: ${{ matrix.shard }}/4
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/rubric_test?sslmode=disable
      RUBRIC_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/rubric_test?sslmode=disable
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00
        with:
          go-version-file: go.mod
      - name: Generated project matrix shard
        run: go test -timeout 45m -run 'TestAcceptanceMatrix' ./internal/acceptance -v
      - name: Install Playwright browsers
        if: matrix.shard == 0
        run: go run github.com/mxschmitt/playwright-go/cmd/playwright@v0.6201.1 install --with-deps chromium
      - name: Tooling, database, terminal, browser, and coverage acceptance
        if: matrix.shard == 0
        run: go test -timeout 45m -skip 'TestAcceptanceMatrix' ./internal/acceptance ./internal/render -v

  scripts:
    name: "Shell scripts: syntax & ShellCheck"
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Shell syntax
        run: for f in scripts/*.sh .github/scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck scripts/*.sh .github/scripts/*.sh

  ci:
    name: CI gate (required)
    if: always()
    needs: [changes, test, acceptance, scripts]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to pass or be skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.result == "success" and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' > /dev/null
